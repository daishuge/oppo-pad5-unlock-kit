name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - powershell
          - pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Parse every PowerShell source file
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw ("AST parse failed: {0}`n{1}" -f $file.FullName, ($errors | Out-String))
            }
          }
          Write-Host ("Parsed {0} PowerShell files." -f $files.Count)

      - name: Run dependency-free mock suite
        shell: ${{ matrix.shell }}
        run: .\tests\run-tests.ps1

  linux-shell:
    name: Linux / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse Android shell scripts
        run: bash -n device/*.sh

      - name: Analyze Android shell scripts
        run: shellcheck -s sh device/*.sh
