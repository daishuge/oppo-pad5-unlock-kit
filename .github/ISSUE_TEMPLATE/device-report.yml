name: Compatibility or failure report
description: Submit redacted, exact evidence for an OPD2506 check or workflow stage.
title: "[device report] "
labels:
  - device-report
body:
  - type: markdown
    attributes:
      value: |
        Remove device serials, account names, file-system user names, private download links, app data, and personal notes before submitting. Do not upload APK, OTA, LK/init_boot images, partition dumps, or private backups.

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Read-only host audit
        - Asset validation
        - Temporary-root confirmation
        - Inactive-slot read-only audit
        - Plan gate
        - LK write readback
        - Fastboot unlock readback
        - Persistent-root reboot verification
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: ro.product.model
      placeholder: OPD2506
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: ro.product.device
      placeholder: OP6542L1
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: ro.build.display.id
    validations:
      required: true

  - type: input
    id: ota
    attributes:
      label: ro.build.version.ota
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Full uname -r
    validations:
      required: true

  - type: dropdown
    id: slot
    attributes:
      label: Starting slot
      options:
        - _a
        - _b
        - unavailable
    validations:
      required: true

  - type: textarea
    id: hashes
    attributes:
      label: Relevant byte lengths and SHA-256 values
      description: Include labels and hashes only. Never attach the image itself.
      render: text

  - type: textarea
    id: redacted_log
    attributes:
      label: Redacted log
      description: Replace every device serial and personal path before pasting.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed serials, personal data, private URLs, app content, and binary payloads.
          required: true
        - label: I understand that a new profile needs independent device evidence and is not automatically supported.
          required: true
